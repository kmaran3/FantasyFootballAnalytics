{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <h2>Current NFL Rosters</h2>

    {% if table_data %}
    <div style="overflow-x: auto;">
        <table class="table table-striped table-bordered">
            <thead>
                <tr>
                    {% for col in columns %}
                    <th>{{ col }}</th>
                    {% endfor %}
                </tr>
            </thead>
            <tbody>
                {% for row in table_data %}
                <tr>
                    {% for col in columns %}
                    <td>{{ row[col] }}</td>
                    {% endfor %}
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
    {% else %}
    <p>No roster data available.</p>
    {% endif %}
</div>
{% endblock %}
