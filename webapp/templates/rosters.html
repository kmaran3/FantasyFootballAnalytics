{% extends "base.html" %}

{% block title %}Rosters{% endblock %}

{% block content %}

<!-- Filter Bar -->
<div class="position-filter-bar">
    <div class="filter-bar-inner" style="width: 90%; flex-wrap: wrap; gap: 10px;">
        <input type="text" id="playerSearch" class="player-search-input" placeholder="Search player...">
        <div class="filter-buttons">
            <button class="position-filter-btn active" data-pos="ALL">All</button>
            <button class="position-filter-btn" data-pos="QB">QB</button>
            <button class="position-filter-btn" data-pos="RB">RB</button>
            <button class="position-filter-btn" data-pos="WR">WR</button>
            <button class="position-filter-btn" data-pos="TE">TE</button>
        </div>
        <select id="teamFilter" style="padding: 6px 12px; font-size: 0.95em; border: 2px solid #444; border-radius: 4px; outline: none; background: #fff; cursor: pointer;">
            <option value="ALL">All Teams</option>
            {% set teams = ['ARI','ATL','BAL','BUF','CAR','CHI','CIN','CLE','DAL','DEN','DET','GB','HOU','IND','JAX','KC','LA','LAC','LV','MIA','MIN','NE','NO','NYG','NYJ','PHI','PIT','SEA','SF','TB','TEN','WAS'] %}
            {% for team in teams %}
            <option value="{{ team }}">{{ team }}</option>
            {% endfor %}
        </select>
    </div>
</div>

<!-- Player List View -->
<div id="player-list" style="padding: 20px 5%;">
    {% if table_data %}
    <div id="player-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 8px;">
        {% for row in table_data %}
        <button
            class="player-btn"
            data-index="{{ loop.index0 }}"
            data-pos="{{ row['Pos'] }}"
            data-team="{{ row['Team'] }}"
            data-name="{{ row['Player'] | lower }}"
            style="background: #444; color: #f8f39fee; border: none; border-radius: 6px; padding: 10px 14px; font-size: 0.95em; text-align: left; cursor: pointer; transition: background-color 0.2s;"
            onmouseover="this.style.backgroundColor='#666'"
            onmouseout="this.style.backgroundColor='#444'"
        >
            <span style="font-weight: bold;">{{ row['Player'] }}</span><br>
            <span style="font-size: 0.8em; opacity: 0.8;">{{ row['Pos'] }} &bull; {{ row['Team'] }}</span>
        </button>
        {% endfor %}
    </div>
    <p id="no-results" style="display:none; text-align:center; color:#888; margin-top: 40px;">No players match your filters.</p>
    {% else %}
    <p>No roster data available.</p>
    {% endif %}
</div>

<!-- Player Profile View -->
<div id="player-profile" style="display:none; padding: 20px 5%;">
    <button onclick="showList()" style="background:#444; color:#f8f39fee; border:none; border-radius:6px; padding: 8px 18px; cursor:pointer; margin-bottom: 24px; font-size: 1em;">
        &larr; Back to Rosters
    </button>
    <h2 id="profile-name" style="margin-bottom: 20px;"></h2>
    <table style="font-size: 1em; border-collapse: collapse; text-align: left; width: auto;">
        <tbody id="profile-fields"></tbody>
    </table>
</div>

<script>
var allPlayers = {{ table_data | tojson }};

var fieldLabels = [
    ['Team', 'Team'],
    ['Pos', 'Position'],
    ['PosGroup', 'Position Group'],
    ['height', 'Height'],
    ['weight', 'Weight'],
    ['BirthDate', 'Birth Date'],
    ['College', 'College'],
    ['CollegeConf', 'College Conference'],
    ['RookieSeason', 'Rookie Season'],
    ['LastSeason', 'Last Season'],
    ['ExperienceYears', 'Experience (yrs)'],
    ['Jersey', 'Jersey #'],
    ['DraftYear', 'Draft Year'],
    ['DraftRound', 'Draft Round'],
    ['DraftPick', 'Draft Pick'],
    ['DraftTeam', 'Draft Team'],
    ['status', 'Status']
];

// Filter logic
var activePos = 'ALL';
var activeTeam = 'ALL';
var searchVal = '';

function applyFilters() {
    var btns = document.querySelectorAll('.player-btn');
    var visible = 0;
    btns.forEach(function(btn) {
        var pos = btn.getAttribute('data-pos');
        var team = btn.getAttribute('data-team');
        var name = btn.getAttribute('data-name');
        var show = (activePos === 'ALL' || pos === activePos)
                && (activeTeam === 'ALL' || team === activeTeam)
                && name.includes(searchVal);
        btn.style.display = show ? '' : 'none';
        if (show) visible++;
    });
    document.getElementById('no-results').style.display = visible === 0 ? 'block' : 'none';
}

document.querySelectorAll('.position-filter-btn').forEach(function(btn) {
    btn.addEventListener('click', function() {
        document.querySelectorAll('.position-filter-btn').forEach(function(b) { b.classList.remove('active'); });
        this.classList.add('active');
        activePos = this.getAttribute('data-pos');
        applyFilters();
    });
});

document.getElementById('teamFilter').addEventListener('change', function() {
    activeTeam = this.value;
    applyFilters();
});

document.getElementById('playerSearch').addEventListener('input', function() {
    searchVal = this.value.toLowerCase();
    applyFilters();
});

// Player click -> profile
document.querySelectorAll('.player-btn').forEach(function(btn) {
    btn.addEventListener('click', function() {
        var idx = parseInt(this.getAttribute('data-index'));
        var player = allPlayers[idx];

        document.getElementById('profile-name').textContent = player['Player'];

        var html = '';
        fieldLabels.forEach(function(pair) {
            var key = pair[0], label = pair[1];
            var val = player[key];
            if (val === null || val === undefined || val === '') val = '—';
            html += '<tr>'
                  + '<td style="font-weight:bold; padding: 8px 32px 8px 0; color:#555;">' + label + '</td>'
                  + '<td style="padding: 8px 0;">' + val + '</td>'
                  + '</tr>';
        });

        document.getElementById('profile-fields').innerHTML = html;
        document.getElementById('player-list').style.display = 'none';
        document.getElementById('player-profile').style.display = 'block';
    });
});

function showList() {
    document.getElementById('player-profile').style.display = 'none';
    document.getElementById('player-list').style.display = 'block';
}
</script>
{% endblock %}
