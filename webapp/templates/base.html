<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Darkhorse{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://code.jquery.com/ui/1.12.1/jquery-ui.min.js"></script>
    <link rel="stylesheet" href="https://code.jquery.com/ui/1.12.1/themes/base/jquery-ui.css">
</head>
<body class="{% block body_class %}{% endblock %}">
<header class="banner">
    <div class="nav-logo">
        <img src="{{ url_for('static', filename='images/flask_logo.png') }}" alt="Darkhorse" class="nav-logo-img">
    </div>
    <nav id="main-nav">
        <ul>
            <li><a href="{{ url_for('main.home') }}">Home</a></li>
            <li><a href="{{ url_for('main.rankings') }}">Rankings</a></li>
            <li style="display:none"><a href="{{ url_for('main.player_comps') }}">Player Comps</a></li>
            <li><a href="{{ url_for('main.mock_draft') }}">Mock Draft</a></li>
            <li><a href="{{ url_for('main.draft_board') }}">Draft Board</a></li>
            <li><a href="{{ url_for('main.my_drafts') }}">My Drafts</a></li>
            <li style="display:none"><a href="{{ url_for('main.rosters') }}">Rosters</a></li>
            <li><a href="{{ url_for('main.about') }}">About</a></li>
            <li><a href="{{ url_for('main.contact') }}">Contact</a></li>
            {% if current_user.is_authenticated %}
                <li class="login"><a class="button" href="{{ url_for('main.logout') }}">Logout</a></li>
            {% else %}
                <li class="login"><a class="button" href="{{ url_for('main.login') }}">Login</a></li>
                <li class="register"><a class="button" href="{{ url_for('main.register') }}">Register</a></li>
            {% endif %}
        </ul>
    </nav>
    <button class="hamburger" id="hamburger-btn" aria-label="Toggle navigation" aria-expanded="false">
        <span></span><span></span><span></span>
    </button>
</header>
<main class="{% block main_class %}{% endblock %}">
    {% block content %}{% endblock %}
</main>
<footer>
    <p>© 2024 Darkhorse CopyrightTM</p>
</footer>
<script>
(function () {
    var btn = document.getElementById('hamburger-btn');
    var nav = document.getElementById('main-nav');
    if (!btn || !nav) return;
    btn.addEventListener('click', function () {
        var open = nav.classList.toggle('nav-open');
        btn.classList.toggle('open', open);
        btn.setAttribute('aria-expanded', open ? 'true' : 'false');
    });
    nav.querySelectorAll('a').forEach(function (link) {
        link.addEventListener('click', function () {
            nav.classList.remove('nav-open');
            btn.classList.remove('open');
            btn.setAttribute('aria-expanded', 'false');
        });
    });
})();
</script>
</body>
</html>
